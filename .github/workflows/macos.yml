name: macOS

# Builds whatever exists for macOS -- the core, the session layer, the FujiNet
# runtime, the full test suite, and the AppKit frontend -- on both Mac
# architectures.
#
# This is the ONLY place macOS is compiled: none of frontends/macos was
# written on a Mac, and nothing on the development machine can build
# Objective-C against Cocoa. A failure here is real signal about that code.
#
# Two legs, one per architecture, as the other siblings ship:
# macos-latest is Apple Silicon (arm64); the Intel leg needs the explicit
# macos-15-intel label (GitHub retired the macos-13 Intel image in December
# 2025). Each leg checks the runner really is the architecture it claims.
#
# -DWITH_ATARI800_ROMS=OFF, as every published build. WITH_FUJINET is left at its
# default ON: tools/fujinet/build-fujinet-desktop.sh has Darwin handling
# (libfujinet.dylib, and it builds mbedTLS 3.6.5 from source because
# Homebrew's is 4.x, which drops the mbedtls/md5.h the firmware includes).

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build-and-test:
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: arm64
            runner: macos-latest
          - arch: x86_64
            runner: macos-15-intel
    runs-on: ${{ matrix.runner }}
    env:
      DYLD_LIBRARY_PATH: /tmp/sdl3-install/lib
    steps:
      - uses: actions/checkout@v4

      - name: Install build tools
        run: brew install cmake ninja python3

      - name: Confirm the runner's architecture matches the matrix leg
        run: |
          test "$(uname -m)" = "${{ matrix.arch }}" \
            || { echo "::error::runner is $(uname -m), expected ${{ matrix.arch }}"; exit 1; }

      - name: Build and install SDL3 (release-3.4.12, pinned)
        run: |
          git clone --depth 1 --branch release-3.4.12 \
            https://github.com/libsdl-org/SDL.git /tmp/sdl3-src
          cmake -S /tmp/sdl3-src -B /tmp/sdl3-build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_INSTALL_PREFIX=/tmp/sdl3-install \
            -DSDL_SHARED=ON -DSDL_STATIC=OFF -DSDL_TEST_LIBRARY=OFF
          cmake --build /tmp/sdl3-build
          cmake --install /tmp/sdl3-build

      # RelWithDebInfo rather than the default Release: same optimisation
      # class, but a crash on a runner we cannot sit at gets line numbers.
      - name: Configure
        run: |
          cmake -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=RelWithDebInfo \
            -DCMAKE_PREFIX_PATH=/tmp/sdl3-install \
            -DWITH_ATARI800_ROMS=OFF

      - name: Build
        run: cmake --build build

      - name: Test
        working-directory: build
        run: ctest --output-on-failure -LE network

      # What the bundle links: system frameworks, SDL3, and libfujinet beside
      # the binary -- nothing from the runner's Homebrew.
      - name: Linked libraries
        run: |
          app="build/frontends/macos/FujiNet Go Atari 800.app/Contents/MacOS"
          otool -L "$app/FujiNet Go Atari 800"
          ls -la "$app"

      # The app on the runner's display: FujiNet's CONFIG after a few
      # seconds, kept as an artifact (the only look at the AppKit frontend
      # anyone gets without a Mac).
      - name: Screenshot
        continue-on-error: true
        run: |
          app="build/frontends/macos/FujiNet Go Atari 800.app/Contents/MacOS/FujiNet Go Atari 800"
          A800_SCREENSHOT="$PWD/macos-${{ matrix.arch }}.png" A800_SCREENSHOT_FRAMES=900 \
            A800_AUTOQUIT_FRAMES=960 "$app" &
          pid=$!
          for i in $(seq 1 90); do kill -0 $pid 2>/dev/null || break; sleep 1; done
          kill $pid 2>/dev/null || true
          ls -la macos-*.png

      - name: Upload the screenshot
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: macos-${{ matrix.arch }}-screenshot
          path: macos-*.png
          if-no-files-found: ignore

      # A crash on a Mac we cannot sit at is only diagnosable with a
      # backtrace: re-run every failing test under lldb and print it.
      - name: Backtraces for failed tests
        if: failure()
        working-directory: build
        run: |
          xcodebuild -version | head -1; uname -a
          for t in $(ctest -N | sed -n 's/^ *Test *#[0-9]*: *//p'); do
            exe=$(ctest -V -R "^$t$" -N 2>/dev/null | sed -n 's/^[0-9]*: Test command: *//p' | head -1 | tr -d '"')
            [ -x "$exe" ] || continue
            echo "=== $t ($exe) ==="
            # (no coreutils `timeout` on macOS; the crashes are immediate)
            lldb --batch \
              -o "settings set target.env-vars DYLD_LIBRARY_PATH=/tmp/sdl3-install/lib" \
              -o "run" -o "bt all" -o "register read" -o "quit" -- "$exe" 2>&1 | tail -120 || true
          done
